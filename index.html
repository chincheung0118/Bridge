<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Team Match IMP Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .vul-active { background-color: #ef4444 !important; color: #ffffff !important; font-weight: bold; }
    .contract-btn { font-size: 11px; padding: 6px 2px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 700; background-color: #f8fafc; }
    .contract-btn.selected { background-color: #2563eb !important; color: #ffffff !important; border-color: #1d4ed8 !important; }
    .step-btn { padding: 10px; border-radius: 8px; font-weight: 700; border: 1px solid #cbd5e1; background-color: #f8fafc; text-align: center; font-size: 13px; }
    .step-btn.selected { background-color: #059669 !important; color: #ffffff !important; border-color: #047857 !important; }
    .step-btn.selected-dbl { background-color: #dc2626 !important; color: #ffffff !important; border-color: #b91c1c !important; }
    .res-btn { font-size: 12px; padding: 8px 4px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 700; background-color: #f8fafc; text-align: center; }
    .res-btn.selected { background-color: #2563eb !important; color: #ffffff !important; border-color: #1d4ed8 !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 text-slate-800">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg flex items-center gap-2"><span>♠️♥️</span> Bridge IMP App</h1>
      <span class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-slate-300" id="roomStatus">Room: Not Connected</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
      <h2 class="font-bold text-sm text-slate-600 mb-2">1. Room & Table Setup</h2>
      <div class="flex gap-2 mb-3">
        <input type="text" id="roomCodeInput" placeholder="Enter Room Code (e.g. 8888)" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="joinRoom()" class="bg-blue-600 text-white font-medium px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Join</button>
      </div>
      <div class="flex gap-2 text-sm">
        <label class="flex-1 bg-slate-50 border p-2.5 rounded-lg flex items-center justify-center gap-2 cursor-pointer">
          <input type="radio" name="roomType" value="Open" checked onchange="switchRoomType('Open')" class="text-blue-600">
          <span class="font-semibold">Open Room</span>
        </label>
        <label class="flex-1 bg-slate-50 border p-2.5 rounded-lg flex items-center justify-center gap-2 cursor-pointer">
          <input type="radio" name="roomType" value="Closed" onchange="switchRoomType('Closed')" class="text-blue-600">
          <span class="font-semibold">Closed Room</span>
        </label>
      </div>
    </div>

    <div class="bg-slate-900 text-white rounded-xl p-4 shadow-md">
      <div class="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Match Result (Total IMPs)</div>
      <div class="flex justify-between items-center text-center">
        <div class="flex-1">
          <div class="text-xs text-slate-400">Team A (N/S)</div>
          <div class="text-3xl font-black text-blue-400" id="teamAScore">0</div>
        </div>
        <div class="px-4 text-slate-500 font-bold text-lg">VS</div>
        <div class="flex-1">
          <div class="text-xs text-slate-400">Team B (E/W)</div>
          <div class="text-3xl font-black text-red-400" id="teamBScore">0</div>
        </div>
      </div>
    </div>

    <div class="space-y-3" id="boardsList"></div>
  </main>

  <script>
    let currentRoom = "DEFAULT";
    let currentRoomType = "Open";

    const vulSchedule = [
      "None", "N-S", "E-W", "All",
      "N-S", "E-W", "All", "None",
      "E-W", "All", "None", "N-S",
      "All", "None", "N-S", "E-W"
    ];

    const suits = ["♣", "♦", "♥", "♠", "NT"];

    let boardsData = JSON.parse(localStorage.getItem("bridge_v14_en_data") || "{}");

    function initData(room) {
      if (!boardsData[room]) {
        boardsData[room] = Array.from({ length: 16 }, (_, i) => ({
          boardNum: i + 1,
          vul: vulSchedule[i],
          open: { level: "", suit: "", declarer: "", dbl: "", result: "", score: null, status: "draft" },
          closed: { level: "", suit: "", declarer: "", dbl: "", result: "", score: null, status: "draft" }
        }));
      }
    }
