<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Team Match IMP Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .vul-active { background-color: #ef4444 !important; color: #ffffff !important; font-weight: bold; }
    .contract-btn { font-size: 11px; padding: 6px 2px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 700; background-color: #f8fafc; }
    .contract-btn.selected { background-color: #2563eb !important; color: #ffffff !important; border-color: #1d4ed8 !important; }
    .step-btn { padding: 8px 4px; border-radius: 8px; font-weight: 700; border: 1px solid #cbd5e1; background-color: #f8fafc; text-align: center; font-size: 11px; }
    .step-btn.selected { background-color: #059669 !important; color: #ffffff !important; border-color: #047857 !important; }
    .step-btn.selected-dbl { background-color: #dc2626 !important; color: #ffffff !important; border-color: #b91c1c !important; }
    .res-btn { font-size: 12px; padding: 8px 4px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 700; background-color: #f8fafc; text-align: center; }
    .res-btn.selected { background-color: #2563eb !important; color: #ffffff !important; border-color: #1d4ed8 !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 text-slate-800">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg flex items-center gap-2"><span>♠️♥️</span> Bridge IMP App</h1>
      <span class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full text-slate-300" id="roomStatus">Room: Not Connected</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">
    <!-- Setup Panel -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h2 class="font-bold text-sm text-slate-600">1. Match & Team Setup</h2>
      
      <div class="flex gap-2">
        <input type="text" id="roomCodeInput" placeholder="Room Code (e.g. 8888)" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="joinRoom()" class="bg-blue-600 text-white font-medium px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Start / Join</button>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="block font-semibold text-slate-600 mb-1">Total Teams (2-6):</label>
          <select id="totalTeamsSelect" onchange="updateMatchConfig()" class="w-full border rounded p-2 bg-slate-50 font-bold">
            <option value="2">2 Teams</option>
            <option value="3">3 Teams</option>
            <option value="4">4 Teams</option>
            <option value="5">5 Teams</option>
            <option value="6">6 Teams</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-1">Boards per Round:</label>
          <select id="boardsPerRoundSelect" onchange="updateMatchConfig()" class="w-full border rounded p-2 bg-slate-50 font-bold">
            <option value="16">16 Boards</option>
            <option value="8">8 Boards</option>
            <option value="12">12 Boards</option>
            <option value="20">20 Boards</option>
          </select>
        </div>
      </div>

      <!-- 2-Team Special Switch Opponents Option -->
      <div id="switchOpponentsWrapper" class="hidden bg-blue-50 border border-blue-200 p-2.5 rounded-lg text-xs space-y-1">
        <label class="flex items-center gap-2 cursor-pointer font-semibold text-blue-900">
          <input type="checkbox" id="switchOpponentsCheckbox" onchange="updateMatchConfig()" class="rounded text-blue-600">
          <span>Switch Opponents at Halfway (Midpoint Board Split)</span>
        </label>
      </div>

      <!-- Player Names Configuration Panel -->
      <div class="border-t pt-2 space-y-2">
        <div class="text-xs font-bold text-slate-700">Team Rosters (Players):</div>
        <div id="rosterInputsContainer" class="space-y-2 text-xs"></div>
      </div>

      <div class="flex gap-2 text-sm pt-2 border-t">
        <label class="flex-1 bg-slate-50 border p-2.5 rounded-lg flex items-center justify-center gap-2 cursor-pointer">
          <input type="radio" name="roomType" value="Open" checked onchange="switchRoomType('Open')" class="text-blue-600">
          <span class="font-semibold">Open Room</span>
        </label>
        <label class="flex-1 bg-slate-50 border p-2.5 rounded-lg flex items-center justify-center gap-2 cursor-pointer">
          <input type="radio" name="roomType" value="Closed" onchange="switchRoomType('Closed')" class="text-blue-600">
          <span class="font-semibold">Closed Room</span>
        </label>
      </div>
    </div>

    <!-- Match Summary -->
    <div class="bg-slate-900 text-white rounded-xl p-4 shadow-md">
      <div class="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider" id="matchSummaryTitle">Match Score</div>
      <div class="flex justify-between items-center text-center">
        <div class="flex-1">
          <div class="text-xs text-slate-400" id="teamANameLabel">Team A (N/S)</div>
          <div class="text-3xl font-black text-blue-400" id="teamAScore">0</div>
        </div>
        <div class="px-4 text-slate-500 font-bold text-lg">VS</div>
        <div class="flex-1">
          <div class="text-xs text-slate-400" id="teamBNameLabel">Team B (E/W)</div>
          <div class="text-3xl font-black text-red-400" id="teamBScore">0</div>
        </div>
      </div>
    </div>

    <div class="space-y-3" id="boardsList"></div>
  </main>

  <script>
    let currentRoom = "DEFAULT";
    let currentRoomType = "Open";

    const defaultVulSchedule = [
      "None", "N-S", "E-W", "All",
      "N-S", "E-W", "All", "None",
      "E-W", "All", "None", "N-S",
      "All", "None", "N-S", "E-W"
    ];

    const suits = ["♣", "♦", "♥", "♠", "NT"];

    let matchConfig = {
      totalTeams: 2,
      boardsCount: 16,
      switchOpponents: false,
      rosters: {
        1: { name: "Team 1", ns: ["North 1", "South 1"], ew: ["East 1", "West 1"] },
        2: { name: "Team 2", ns: ["North 2", "South 2"], ew: ["East 2", "West 2"] },
        3: { name: "Team 3", ns: ["North 3", "South 3"], ew: ["East 3", "West 3"] },
        4: { name: "Team 4", ns: ["North 4", "South 4"], ew: ["East 4", "West 4"] },
        5: { name: "Team 5", ns: ["North 5", "South 5"], ew: ["East 5", "West 5"] },
        6: { name: "Team 6", ns: ["North 6", "South 6"], ew: ["East 6", "West 6"] }
      }
    };

    let boardsData = JSON.parse(localStorage.getItem("bridge_v16_data") || "{}");

    function initData(room) {
      if (!boardsData[room]) {
        boardsData[room] = {
          config: JSON.parse(JSON.stringify(matchConfig)),
          boards: Array.from({ length: matchConfig.boardsCount }, (_, i) => ({
            boardNum: i + 1,
            vul: defaultVulSchedule[i % 16],
            uploadedPhoto: null,     // Shared status for camera upload across tables
            ddAnalysis: null,        // Double Dummy analysis results
            open: { level: "", suit: "", declarer: "", dbl: "", result: "", score: null, status: "draft" },
            closed: { level: "", suit: "", declarer: "", dbl: "", result: "", score: null, status: "draft" }
          }))
        };
      } else {
        if (boardsData[room].config) {
          matchConfig = boardsData[room].config;
          document.getElementById('totalTeamsSelect').value = matchConfig.totalTeams;
          document.getElementById('boardsPerRoundSelect').value = matchConfig.boardsCount;
          document.getElementById('switchOpponentsCheckbox').checked = matchConfig.switchOpponents;
        }
      }
      renderRosterInputs();
    }

    function joinRoom() {
      const code = document.getElementById('roomCodeInput').value.trim();
      if (!code) return alert("Please enter a room code!");
      currentRoom = code;
      document.getElementById('roomStatus').innerText = `Room: ${currentRoom}`;
      initData(currentRoom);
      renderBoards();
    }

    function updateMatchConfig() {
      matchConfig.totalTeams = parseInt(document.getElementById('totalTeamsSelect').value);
      matchConfig.boardsCount = parseInt(document.getElementById('boardsPerRoundSelect').value);
      matchConfig.switchOpponents = document.getElementById('switchOpponentsCheckbox').checked;

      const switchWrapper = document.getElementById('switchOpponentsWrapper');
      if (matchConfig.totalTeams === 2) {
        switchWrapper.classList.remove('hidden');
      } else {
        switchWrapper.classList.add('hidden');
        matchConfig.switchOpponents = false;
      }

      collectRosterInputs();
      
      if (boardsData[currentRoom]) {
        boardsData[currentRoom].config = JSON.parse(JSON.stringify(matchConfig));
        if (boardsData[currentRoom].boards.length !== matchConfig.boardsCount) {
          boardsData[currentRoom].boards = Array.from({ length: matchConfig.boardsCount }, (_, i) => ({
            boardNum: i + 1,
            vul: defaultVulSchedule[i % 16],
            uploadedPhoto: null,
            ddAnalysis: null,
            open: { level: "", suit: "", declarer: "", dbl: "", result: "", score: null, status: "draft" },
            closed: { level: "", suit: "", declarer: "", dbl: "", result: "", score: null, status: "draft" }
          }));
        }
      }
      saveAndRefresh();
    }

    function renderRosterInputs() {
      const container = document.getElementById('rosterInputsContainer');
      container.innerHTML = '';
      for (let i = 1; i <= matchConfig.totalTeams; i++) {
        const r = matchConfig.rosters[i];
        container.innerHTML += `
          <div class="bg-slate-50 p-2 rounded border space-y-1">
            <div class="flex gap-2 items-center">
              <span class="font-bold text-slate-700 w-16">Team ${i}:</span>
              <input type="text" id="teamName_${i}" value="${r.name}" oninput="collectRosterInputs()" placeholder="Team Name" class="flex-1 border rounded px-2 py-1 text-xs">
            </div>
            <div class="grid grid-cols-2 gap-1 text-[11px]">
              <input type="text" id="teamNS_${i}" value="${r.ns.join(', ')}" oninput="collectRosterInputs()" placeholder="N/S Players" class="border rounded px-2 py-1">
              <input type="text" id="teamEW_${i}" value="${r.ew.join(', ')}" oninput="collectRosterInputs()" placeholder="E/W Players" class="border rounded px-2 py-1">
            </div>
          </div>
        `;
      }
    }

    function collectRosterInputs() {
      for (let i = 1; i <= matchConfig.totalTeams; i++) {
        const nameInput = document.getElementById(`teamName_${i}`);
        const nsInput = document.getElementById(`teamNS_${i}`);
        const ewInput = document.getElementById(`teamEW_${i}`);
        if (nameInput && nsInput && ewInput) {
          matchConfig.rosters[i].name = nameInput.value;
          matchConfig.rosters[i].ns = nsInput.value.split(',').map(s => s.trim()).filter(Boolean);
          matchConfig.rosters[i].ew = ewInput.value.split(',').map(s => s.trim()).filter(Boolean);
        }
      }
      if (boardsData[currentRoom]) {
        boardsData[currentRoom].config = JSON.parse(JSON.stringify(matchConfig));
      }
    }

    function switchRoomType(type) {
      currentRoomType = type;
      renderBoards();
    }

    // Camera Hand Record Upload & AI Double Dummy Simulation Simulation
    function handleBoardPhoto(idx, event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const roomData = boardsData[currentRoom];
        const b = roomData.boards[idx];
        
        // Mark as uploaded across all tables in this room
        b.uploadedPhoto = {
          name: file.name,
          dataUrl: e.target.result,
          timestamp: new Date().toLocaleTimeString()
        };

        // Simulate AI Hand Record & Double Dummy Optimal Contract Analysis (Par Score)
        b.ddAnalysis = {
          parScore: "NS +420 (4♠ N =)",
          optimalContracts: {
            N: "4♠ by N (10 tricks)",
            S: "4♠ by S (10 tricks)",
            E: "3NT by E (9 tricks down)",
            W: "3NT by W (9 tricks down)"
          }
        };

        saveAndRefresh();
        alert(`Board ${b.boardNum} Hand Record uploaded successfully! Shared with all tables.`);
      };
      reader.readAsDataURL(file);
    }

    function calculateRawScore(level, suit, declarer, dbl, resultStr, vul) {
      if (!level || !suit || !declarer || dbl === "" || resultStr === "") return null;
      const l = parseInt(level);
      const res = parseInt(resultStr);
      const isVul = (vul === 'All') || 
                    (vul === 'N-S' && (declarer === 'N' || declarer === 'S')) || 
                    (vul === 'E-W' && (declarer === 'E' || declarer === 'W'));

      const isDbl = dbl === 'X';
      const isRedbl = dbl === 'XX';

      if (res < 0) {
        const undertricks = Math.abs(res);
        let penalty = 0;
        if (!isDbl && !isRedbl) {
          penalty = undertricks * (isVul ? 100 : 50);
        } else if (isDbl) {
          if (!isVul) {
            if (undertricks >= 1) penalty += 100;
            if (undertricks >= 2) penalty += 200;
            if (undertricks >= 3) penalty += 200;
            if (undertricks > 3) penalty += (undertricks - 3) * 300;
          } else {
            if (undertricks >= 1) penalty += 200;
            if (undertricks > 1) penalty += (undertricks - 1) * 300;
          }
        } else if (isRedbl) {
          if (!isVul) {
            if (undertricks >= 1) penalty += 200;
            if (undertricks >= 2) penalty += 400;
            if (undertricks >= 3) penalty += 400;
            if (undertricks > 3) penalty += (undertricks - 3) * 600;
          } else {
            if (undertricks >= 1) penalty += 400;
            if (undertricks > 1) penalty += (undertricks - 1) * 600;
          }
        }
        let finalPenalty = -penalty;
        if (declarer === 'E' || declarer === 'W') finalPenalty = -finalPenalty;
        return finalPenalty;
      }

      let trickPts = 0;
      if (suit === '♣' || suit === '♦') trickPts = l * 20;
      else if (suit === '♠' || suit === '♥') trickPts = l * 30;
      else if (suit === 'NT') trickPts = 40 + (l - 1) * 30;

      if (isDbl) trickPts *= 2;
      if (isRedbl) trickPts *= 4;

      let score = trickPts;
      if (trickPts >= 100) score += isVul ? 500 : 300;
      else score += 50;

      if (l === 6) score += isVul ? 750 : 500;
      if (l === 7) score += isVul ? 1500 : 1000;
      if (isDbl) score += 50;
      if (isRedbl) score += 100;

      if (res > 0) {
        if (!isDbl && !isRedbl) score += res * ((suit === '♣' || suit === '♦') ? 20 : 30);
        else if (isDbl) score += res * (isVul ? 200 : 100);
        else if (isRedbl) score += res * (isVul ? 400 : 200);
      }

      if (declarer === 'E' || declarer === 'W') score = -score;
      return score;
    }

    function calculateIMP(diff) {
      const abs = Math.abs(diff);
      const scale = [20, 50, 90, 140, 170, 220, 260, 310, 360, 425, 490, 590, 740, 890, 1090, 1290, 1490, 1740, 1990, 2240, 2490, 2990, 3490, 3990];
      let imp = 0;
      for (let i = 0; i < scale.length; i++) {
        if (abs >= scale[i]) imp = i + 1;
        else break;
      }
      return diff >= 0 ? imp : -imp;
    }

    function selectContract(idx, roomKey, lvl, suit) {
      const target = getTargetData(idx, roomKey);
      if (target.status === 'confirmed') return;
      target.level = lvl.toString();
      target.suit = suit;
      target.declarer = ""; target.dbl = ""; target.result = ""; target.score = null;
      saveAndRefresh();
    }

    function selectDeclarer(idx, roomKey, dir) {
      const target = getTargetData(idx, roomKey);
      if (target.status === 'confirmed') return;
      target.declarer = dir;
      target.dbl = ""; target.result = ""; target.score = null;
      saveAndRefresh();
    }

    function selectDouble(idx, roomKey, dblVal) {
      const target = getTargetData(idx, roomKey);
      if (target.status === 'confirmed') return;
      target.dbl = dblVal;
      target.result = ""; target.score = null;
      saveAndRefresh();
    }

    function selectResult(idx, roomKey, resVal) {
      const roomData = boardsData[currentRoom];
      const b = roomData.boards[idx];
      const target = getTargetData(idx, roomKey);
      if (target.status === 'confirmed') return;
      target.result = resVal.toString();
      target.score = calculateRawScore(target.level, target.suit, target.declarer, target.dbl, target.result, b.vul);
      target.status = target.score !== null ? 'pending' : 'draft';
      saveAndRefresh();
    }

    function getTargetData(idx, roomKey) {
      const roomData = boardsData[currentRoom];
      const b = roomData.boards[idx];
      return roomKey === 'open' ? b.open : b.closed;
    }

    function confirmScore(idx, roomKey) {
      const target = getTargetData(idx, roomKey);
      target.status = 'confirmed';
      saveAndRefresh();
    }

    function editScore(idx, roomKey) {
      const target = getTargetData(idx, roomKey);
      target.status = 'pending';
      saveAndRefresh();
    }

    function saveAndRefresh() {
      localStorage.setItem("bridge_v16_data", JSON.stringify(boardsData));
      renderBoards();
    }

    function renderBoards() {
      initData(currentRoom);
      const roomData = boardsData[currentRoom];
      const container = document.getElementById('boardsList');
      container.innerHTML = '';

      let totalA = 0;
      let totalB = 0;

      roomData.boards.forEach((b, idx) => {
        const isCurrentOpen = currentRoomType === 'Open';
        const myData = isCurrentOpen ? b.open : b.closed;
        const oppData = isCurrentOpen ? b.closed : b.open;
        const myRoomKey = isCurrentOpen ? 'open' : 'closed';

        const vulN = b.vul === 'All' || b.vul === 'N-S';
        const vulS = b.vul === 'All' || b.vul === 'N-S';
        const vulE = b.vul === 'All' || b.vul === 'E-W';
        const vulW = b.vul === 'All' || b.vul === 'E-W';

        let impText = '🔒 Hidden';
        if (b.open.status === 'confirmed' && b.closed.status === 'confirmed') {
          const diff = b.open.score - b.closed.score;
          const imp = calculateIMP(diff);
          if (imp > 0) { totalA += imp; impText = `+${imp} IMP (Team 1)`; }
          else if (imp < 0) { totalB += Math.abs(imp); impText = `+${Math.abs(imp)} IMP (Team 2)`; }
          else impText = '0 IMP';
        }

        const isLocked = myData.status === 'confirmed';
        const step1Done = !!myData.level && !!myData.suit;
        const step2Done = step1Done && !!myData.declarer;
        const step3Done = step2Done && myData.dbl !== "";

        let pNorth = matchConfig.rosters[1].ns[0] || "North";
        let pSouth = matchConfig.rosters[1].ns[1] || "South";
        let pEast = matchConfig.rosters[2].ew[0] || "East";
        let pWest = matchConfig.rosters[2].ew[1] || "West";

        // 1. Contract Matrix
        let matrixHtml = `<div class="grid grid-cols-5 gap-1">`;
        for (let l = 1; l <= 7; l++) {
          suits.forEach(s => {
            const isSelected = myData.level == l && myData.suit === s;
            const isRedSuit = s === '♥' || s === '♦';
            const colorClass = isRedSuit ? 'text-red-600' : 'text-slate-800';
            matrixHtml += `
              <button ${isLocked ? 'disabled' : ''} onclick="selectContract(${idx}, '${myRoomKey}', ${l}, '${s}')" 
                      class="contract-btn ${isSelected ? 'selected' : ''} ${colorClass}">
                ${l}${s}
              </button>
            `;
          });
        }
        matrixHtml += `</div>`;

        // 2. Diamond Declarer Pad
        let declarerHtml = '';
        if (step1Done && !isLocked) {
          declarerHtml = `
            <div class="mt-3 pt-2 border-t border-slate-100">
              <div class="text-[11px] font-bold text-slate-500 mb-2">Step 2: Select Declarer & Player:</div>
              <div class="flex flex-col items-center max-w-[220px] mx-auto gap-1">
                <button onclick="selectDeclarer(${idx}, '${myRoomKey}', 'N')" class="step-btn w-36 truncate ${myData.declarer === 'N' ? 'selected' : ''}">North (${pNorth})</button>
                <div class="flex gap-4 w-full justify-between">
                  <button onclick="selectDeclarer(${idx}, '${myRoomKey}', 'W')" class="step-btn w-24 truncate ${myData.declarer === 'W' ? 'selected' : ''}">West (${pWest})</button>
                  <button onclick="selectDeclarer(${idx}, '${myRoomKey}', 'E')" class="step-btn w-24 truncate ${myData.declarer === 'E' ? 'selected' : ''}">East (${pEast})</button>
                </div>
                <button onclick="selectDeclarer(${idx}, '${myRoomKey}', 'S')" class="step-btn w-36 truncate ${myData.declarer === 'S' ? 'selected' : ''}">South (${pSouth})</button>
              </div>
            </div>
          `;
        }

        // 3. Double Options
        let doubleHtml = '';
        if (step2Done && !isLocked) {
          doubleHtml = `
            <div class="mt-3 pt-2 border-t border-slate-100">
              <div class="text-[11px] font-bold text-slate-500 mb-1">Step 3: Select Double:</div>
              <div class="flex gap-1.5">
                <button onclick="selectDouble(${idx}, '${myRoomKey}', 'NONE')" class="step-btn flex-1 py-2 ${myData.dbl === 'NONE' ? 'selected' : ''}">None</button>
                <button onclick="selectDouble(${idx}, '${myRoomKey}', 'X')" class="step-btn flex-1 py-2 ${myData.dbl === 'X' ? 'selected-dbl' : ''}">X (Dbl)</button>
                <button onclick="selectDouble(${idx}, '${myRoomKey}', 'XX')" class="step-btn flex-1 py-2 ${myData.dbl === 'XX' ? 'selected-dbl' : ''}">XX (Rdbl)</button>
              </div>
            </div>
          `;
        }

        // 4. Result Matrix
        let resultHtml = '';
        if (step3Done && !isLocked) {
          const levelNum = parseInt(myData.level);
          const maxOver = 7 - levelNum;
          const maxUnder = levelNum + 6;

          let overButtonsHtml = '';
          for (let i = 1; i <= maxOver; i++) {
            const valStr = i.toString();
            const isSel = myData.result === valStr;
            overButtonsHtml += `<button onclick="selectResult(${idx}, '${myRoomKey}', '${valStr}')" class="res-btn ${isSel ? 'selected' : ''}">+${i}</button>`;
          }

          let underButtonsHtml = '';
          for (let i = 1; i <= maxUnder; i++) {
            const valStr = `-${i}`;
            const isSel = myData.result === valStr;
            underButtonsHtml += `<button onclick="selectResult(${idx}, '${myRoomKey}', '${valStr}')" class="res-btn ${isSel ? 'selected' : ''}">-${i}</button>`;
          }

          const isEqualsSel = myData.result === '0';

          resultHtml = `
            <div class="mt-3 pt-2 border-t border-slate-100 space-y-2">
              <div class="text-[11px] font-bold text-slate-500">Step 4: Select Result:</div>
              ${maxOver > 0 ? `<div><div class="text-[10px] text-blue-600 font-semibold mb-1">Overtricks:</div><div class="grid grid-cols-7 gap-1">${overButtonsHtml}</div></div>` : ''}
              <div class="flex justify-center py-1">
                <button onclick="selectResult(${idx}, '${myRoomKey}', '0')" class="w-full py-2.5 rounded-lg border text-base font-black shadow-sm ${isEqualsSel ? 'bg-blue-600 text-white border-blue-700' : 'bg-blue-50 border-blue-300 text-blue-700 hover:bg-blue-100'}">= (Made)</button>
              </div>
              <div><div class="text-[10px] text-red-600 font-semibold mb-1">Undertricks:</div><div class="grid grid-cols-7 gap-1">${underButtonsHtml}</div></div>
            </div>
          `;
        }

        // Shared Camera & Hand Record / Double Dummy Section
        const hasPhoto = b.uploadedPhoto;
        let photoSectionHtml = `
          <div class="bg-slate-50 p-2 rounded border flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <span class="text-slate-600 font-medium">📷 Hand Record / Traveler:</span>
              <span class="font-bold ${hasPhoto ? 'text-green-600' : 'text-amber-600'}">
                ${hasPhoto ? '✅ [Uploaded / Synced]' : '⏳ Not Uploaded'}
              </span>
            </div>
            <label class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded cursor-pointer text-xs font-bold shadow-sm">
              ${hasPhoto ? 'Change Photo' : 'Take Photo / Upload'}
              <input type="file" accept="image/*" onchange="handleBoardPhoto(${idx}, event)" class="hidden">
            </label>
          </div>
        `;

        let ddAnalysisHtml = '';
        if (b.ddAnalysis) {
          ddAnalysisHtml = `
            <div class="bg-indigo-50 border border-indigo-200 p-2.5 rounded text-xs space-y-1">
              <div class="font-bold text-indigo-900 flex justify-between">
                <span>🤖 AI Double Dummy Analysis (Par):</span>
                <span class="text-indigo-700 font-black">${b.ddAnalysis.parScore}</span>
              </div>
              <div class="text-[11px] text-indigo-800 grid grid-cols-2 gap-1 pt-1 border-t border-indigo-200">
                <div>North: ${b.ddAnalysis.optimalContracts.N}</div>
                <div>South: ${b.ddAnalysis.optimalContracts.S}</div>
                <div>East: ${b.ddAnalysis.optimalContracts.E}</div>
                <div>West: ${b.ddAnalysis.optimalContracts.W}</div>
              </div>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = "bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-2";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b pb-2">
            <div class="flex items-center gap-2">
              <span class="font-bold text-base text-slate-800">Board ${b.boardNum}</span>
              <span class="text-xs bg-slate-100 px-2 py-0.5 rounded font-medium text-slate-600">Vul: ${b.vul}</span>
            </div>
            <div class="flex text-xs font-semibold rounded overflow-hidden border">
              <span class="px-1.5 py-0.5 ${vulN ? 'vul-active' : 'bg-slate-50 text-slate-400'}">N</span>
              <span class="px-1.5 py-0.5 ${vulS ? 'vul-active' : 'bg-slate-50 text-slate-400'}">S</span>
              <span class="px-1.5 py-0.5 ${vulE ? 'vul-active' : 'bg-slate-50 text-slate-400'}">E</span>
              <span class="px-1.5 py-0.5 ${vulW ? 'vul-active' : 'bg-slate-50 text-slate-400'}">W</span>
            </div>
          </div>

          ${photoSectionHtml}
          ${ddAnalysisHtml}

          <div><div class="text-[11px] font-bold text-slate-500 mb-1">Step 1: Select Contract (1♣ - 7NT):</div>${matrixHtml}</div>
          ${declarerHtml}
          ${doubleHtml}
          ${resultHtml}

          <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded text-xs mt-3">
            <div>
              <span class="font-bold text-slate-700">Contract:</span> 
              <span class="font-bold text-blue-600">
                ${myData.level ? myData.level + myData.suit : '-'}
                ${myData.declarer ? ' by ' + myData.declarer : ''}
                ${myData.dbl && myData.dbl !== 'NONE' ? ' ' + myData.dbl : ''}
                ${myData.result !== "" ? ' (' + (myData.result === '0' ? '=' : parseInt(myData.result) > 0 ? '+' + myData.result : myData.result) + ')' : ''}
              </span>
              <br>
              <span class="font-bold text-slate-700">Score:</span> <span class="font-black text-slate-900">${myData.score !== null ? (myData.score > 0 ? '+' + myData.score : myData.score) : '-'}</span>
            </div>
            <div>
              ${myData.status === 'pending' ? `<button onclick="confirmScore(${idx}, '${myRoomKey}')" class="bg-green-600 hover:bg-green-700 text-white font-bold px-3 py-1.5 rounded text-xs shadow-sm">✅ Confirm</button>` : myData.status === 'confirmed' ? `<button onclick="editScore(${idx}, '${myRoomKey}')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-2.5 py-1 rounded text-xs border border-slate-300">✏️ Edit</button>` : ''}
            </div>
          </div>

          <div class="text-xs text-slate-500 flex justify-between items-center border-t pt-2">
            <span>Other Room: ${b.open.status === 'confirmed' && b.closed.status === 'confirmed' ? oppData.score : '🔒 Hidden'}</span>
            <span class="font-bold text-blue-600">${impText}</span>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('teamANameLabel').innerText = `${matchConfig.rosters[1].name} (N/S)`;
      document.getElementById('teamBNameLabel').innerText = `${matchConfig.rosters[2].name} (E/W)`;
      document.getElementById('teamAScore').innerText = totalA;
      document.getElementById('teamBScore').innerText = totalB;
    }

    initData(currentRoom);
    renderBoards();
  </script>
</body>
</html>
