<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Bridge Director & VP App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .contract-btn { font-size: 11px; padding: 6px 2px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 700; background-color: #f8fafc; }
    .contract-btn.selected { background-color: #2563eb !important; color: #ffffff !important; border-color: #1d4ed8 !important; }
    .step-btn { padding: 8px 4px; border-radius: 8px; font-weight: 700; border: 1px solid #cbd5e1; background-color: #f8fafc; text-align: center; font-size: 11px; }
    .step-btn.selected { background-color: #059669 !important; color: #ffffff !important; border-color: #047857 !important; }
    .step-btn.selected-dbl { background-color: #dc2626 !important; color: #ffffff !important; border-color: #b91c1c !important; }
    .res-btn { font-size: 12px; padding: 8px 4px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 700; background-color: #f8fafc; text-align: center; }
    .res-btn.selected { background-color: #2563eb !important; color: #ffffff !important; border-color: #1d4ed8 !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 text-slate-800">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="font-bold text-base flex items-center gap-2"><span>♠️♥️</span> Pro Bridge Director</h1>
      <div class="flex items-center gap-2">
        <button onclick="switchView('scoring')" id="btnViewScoring" class="text-xs bg-blue-600 px-3 py-1 rounded font-bold">Scoring</button>
        <button onclick="switchView('movement')" id="btnViewMovement" class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded font-bold">📋 Movement</button>
        <button onclick="requestAdminAccess()" id="btnViewAdmin" class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded font-bold">👑 Admin & Roster</button>
      </div>
    </div>
  </header>

  <div id="globalRosterBanner" class="bg-slate-800 text-slate-200 text-xs py-2 px-4 shadow-inner">
    <div class="max-w-xl mx-auto flex flex-col gap-1" id="rosterBannerContent">
      <span>Match not connected</span>
    </div>
  </div>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- SCORING VIEW -->
    <div id="viewScoring" class="space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-3">
        <h2 class="font-bold text-sm text-slate-600">1. Select Match & Table Setup</h2>
        
        <div class="space-y-2">
          <div>
            <label class="block font-semibold text-slate-600 mb-1 text-xs">Step A: Select Match</label>
            <select id="matchDropdownSelect" onchange="onMatchDropdownChange()" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-50 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">-- Select Match --</option>
            </select>
          </div>

          <div>
            <label class="block font-semibold text-slate-600 mb-1 text-xs">Step B: Select Active Table</label>
            <select id="roomTypeSelect" onchange="onTableDropdownChange()" disabled class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50">
              <option value="">-- Please Select Match First --</option>
            </select>
          </div>
        </div>

        <button id="btnJoinMatch" onclick="joinSelectedMatch()" disabled class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-sm disabled:opacity-40">🚀 Step C: Confirm Seating & Start Match</button>
      </div>

      <div class="space-y-3" id="boardsList"></div>
    </div>

    <!-- MOVEMENT VIEW -->
    <div id="viewMovement" class="space-y-4 hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-3">
        <h2 class="font-bold text-base text-slate-800 border-b pb-2">📋 Movement & Round Verification Guide</h2>
        <div id="movementSummaryCard" class="space-y-3 pt-2"></div>
      </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="viewAdmin" class="space-y-4 hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-base text-slate-800">👑 Tournament Director Admin & Player Roster</h2>
          <span class="text-[11px] bg-slate-100 text-slate-600 font-bold px-2.5 py-1 rounded border border-slate-300">TD Control</span>
        </div>

        <!-- 1. Player Database Roster -->
        <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-200 space-y-3 text-xs">
          <div class="font-bold text-indigo-900 flex justify-between items-center">
            <span>👤 Global Player Database Roster</span>
            <span id="playerCountBadge" class="bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded font-bold">0 Players</span>
          </div>
          <div class="flex gap-2">
            <input type="text" id="newPlayerNameInput" placeholder="Enter Player Name" class="flex-1 border rounded px-2 py-1.5 text-xs bg-white font-bold">
            <button onclick="addPlayerToRoster()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded font-bold text-xs">➕ Add Player</button>
          </div>
          <div id="rosterTagsContainer" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>
        
        <!-- 2. Match Creation & Setup -->
        <div class="bg-slate-50 p-3 rounded-lg border space-y-3 text-xs">
          <div class="font-bold text-slate-700">📌 Create New Match:</div>
          <div class="space-y-2">
            <div>
              <label class="block font-semibold text-slate-600 mb-1">1. Match Name:</label>
              <input type="text" id="newMatchNameInput" placeholder="e.g. Match 1" class="w-full border rounded px-2 py-1.5 text-xs bg-white font-bold">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-semibold text-slate-600 mb-1">2. No. of Teams:</label>
                <select id="newMatchTeams" class="w-full border rounded p-1.5 bg-white font-bold">
                  <option value="2">2 Teams (2 Tables)</option>
                  <option value="3" selected>3 Teams (3 Tables)</option>
                  <option value="4">4 Teams (4 Tables)</option>
                  <option value="5">5 Teams (5 Tables)</option>
                  <option value="6">6 Teams (6 Tables)</option>
                </select>
              </div>
              <div>
                <label class="block font-semibold text-slate-600 mb-1">3. Boards / Round:</label>
                <input type="number" id="newMatchBoards" min="1" max="24" value="3" class="w-full border rounded p-1.5 bg-white font-bold">
              </div>
            </div>
            <div>
              <label class="block font-semibold text-slate-600 mb-1">4. Movement System:</label>
              <select id="newMatchMovement" class="w-full border rounded p-1.5 bg-white font-bold">
                <option value="RoundRobin">Multi-Table Round Robin</option>
                <option value="Mitchell">Mitchell Movement</option>
                <option value="Swiss">Swiss Movement</option>
              </select>
            </div>
            <button onclick="create
